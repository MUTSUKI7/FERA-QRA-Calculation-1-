<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stopwatch</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    width: 100%;
    background: #0B0E11;
    color: #EDEFF1;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px;
  }

  .label {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #6B7280;
    margin-bottom: 40px;
  }

  .dial {
    position: relative;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    border: 2px solid #252A31;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }

  .dial.running {
    border-color: #E8703A;
    box-shadow: 0 0 0 1px rgba(232,112,58,0.15), 0 0 40px rgba(232,112,58,0.12);
  }

  .tick {
    position: absolute;
    top: 50%;
    left: 50%;
    background: #2E343C;
    transform-origin: center;
  }

  .main-time {
    font-size: 46px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }

  .centis {
    font-size: 18px;
    color: #E8703A;
    font-variant-numeric: tabular-nums;
    margin-top: 4px;
  }

  .controls {
    display: flex;
    gap: 14px;
    margin-top: 44px;
  }

  .btn {
    border: none;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-radius: 4px;
    padding: 14px 28px;
    transition: transform 0.08s ease, filter 0.15s ease;
    background: transparent;
    color: #EDEFF1;
    border: 1px solid #3A4048;
  }

  .btn:active { transform: scale(0.96); }
  .btn:hover:not(:disabled) { filter: brightness(1.1); }
  .btn:disabled { color: #3A4048; border-color: #20242A; cursor: not-allowed; }

  .btn-primary { background: #E8703A; color: #0B0E11; border: none; }
  .btn-stop { background: #EDEFF1; color: #0B0E11; border: none; }

  .laps {
    width: 100%;
    max-width: 340px;
    margin-top: 40px;
    max-height: 260px;
    overflow-y: auto;
  }

  .laps::-webkit-scrollbar { width: 6px; }
  .laps::-webkit-scrollbar-thumb { background: #2A3038; border-radius: 3px; }

  .laps-header {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #6B7280;
    padding: 0 4px 10px;
    font-family: 'IBM Plex Sans', sans-serif;
  }

  .lap-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 4px;
    border-bottom: 1px solid #1E2328;
    font-size: 14px;
  }

  .lap-num { color: #6B7280; width: 40px; }
  .lap-total { color: #6B7280; font-variant-numeric: tabular-nums; }
  .lap-split { font-variant-numeric: tabular-nums; }

  .best { color: #4ADE80; }
  .worst { color: #E8703A; }
</style>
</head>
<body>

  <div class="label">Stopwatch</div>

  <div class="dial" id="dial"></div>

  <div class="controls">
    <button class="btn btn-primary" id="startBtn">Start</button>
    <button class="btn" id="lapBtn" disabled>Lap</button>
    <button class="btn" id="resetBtn" disabled>Reset</button>
  </div>

  <div class="laps" id="lapsContainer" style="display:none;">
    <div class="laps-header">
      <span>Lap</span><span>Split</span><span>Total</span>
    </div>
    <div id="lapsList"></div>
  </div>

<script>
  let elapsedMs = 0;
  let running = false;
  let startTime = 0;
  let rafId = null;
  let laps = [];

  const dial = document.getElementById('dial');
  const startBtn = document.getElementById('startBtn');
  const lapBtn = document.getElementById('lapBtn');
  const resetBtn = document.getElementById('resetBtn');
  const lapsContainer = document.getElementById('lapsContainer');
  const lapsList = document.getElementById('lapsList');

  // draw tick marks
  for (let i = 0; i < 60; i++) {
    const isMajor = i % 5 === 0;
    const angle = (i / 60) * 360;
    const tick = document.createElement('div');
    tick.className = 'tick';
    tick.style.width = (isMajor ? 2 : 1) + 'px';
    tick.style.height = (isMajor ? 10 : 5) + 'px';
    tick.style.transform = `rotate(${angle}deg) translate(0, -128px)`;
    dial.appendChild(tick);
  }

  const mainTimeEl = document.createElement('div');
  mainTimeEl.className = 'main-time';
  mainTimeEl.textContent = '00:00';
  dial.appendChild(mainTimeEl);

  const centisEl = document.createElement('div');
  centisEl.className = 'centis';
  centisEl.textContent = '.00';
  dial.appendChild(centisEl);

  function pad(n, l = 2) { return String(n).padStart(l, '0'); }

  function format(ms) {
    const totalCentis = Math.floor(ms / 10);
    const centis = totalCentis % 100;
    const totalSeconds = Math.floor(ms / 1000);
    const seconds = totalSeconds % 60;
    const minutes = Math.floor(totalSeconds / 60) % 60;
    const hours = Math.floor(totalSeconds / 3600);
    const main = `${hours > 0 ? pad(hours) + ':' : ''}${pad(minutes)}:${pad(seconds)}`;
    return { main, centis: pad(centis) };
  }

  function render() {
    const { main, centis } = format(elapsedMs);
    mainTimeEl.textContent = main;
    centisEl.textContent = '.' + centis;
  }

  function tick() {
    elapsedMs = Date.now() - startTime;
    render();
    rafId = requestAnimationFrame(tick);
  }

  function renderLaps() {
    lapsList.innerHTML = '';
    if (laps.length === 0) {
      lapsContainer.style.display = 'none';
      return;
    }
    lapsContainer.style.display = 'block';

    let bestIdx = -1, worstIdx = -1;
    if (laps.length > 1) {
      const splits = laps.map((t, i) => i === laps.length - 1 ? t : laps[i] - laps[i + 1]);
      const min = Math.min(...splits);
      const max = Math.max(...splits);
      bestIdx = splits.indexOf(min);
      worstIdx = splits.indexOf(max);
    }

    laps.forEach((t, idx) => {
      const lapNumber = laps.length - idx;
      const split = idx === laps.length - 1 ? t : t - laps[idx + 1];
      const splitFmt = format(split);
      const totalFmt = format(t);

      let cls = '';
      if (laps.length > 1 && idx === bestIdx) cls = 'best';
      else if (laps.length > 1 && idx === worstIdx) cls = 'worst';

      const row = document.createElement('div');
      row.className = 'lap-row';
      row.innerHTML = `
        <span class="lap-num">${pad(lapNumber)}</span>
        <span class="lap-split ${cls}">${splitFmt.main}.${splitFmt.centis}</span>
        <span class="lap-total">${totalFmt.main}.${totalFmt.centis}</span>
      `;
      lapsList.appendChild(row);
    });
  }

  startBtn.addEventListener('click', () => {
    if (!running) {
      startTime = Date.now() - elapsedMs;
      running = true;
      dial.classList.add('running');
      startBtn.textContent = 'Stop';
      startBtn.classList.remove('btn-primary');
      startBtn.classList.add('btn-stop');
      lapBtn.disabled = false;
      resetBtn.disabled = false;
      rafId = requestAnimationFrame(tick);
    } else {
      running = false;
      dial.classList.remove('running');
      startBtn.textContent = 'Resume';
      startBtn.classList.remove('btn-stop');
      startBtn.classList.add('btn-primary');
      lapBtn.disabled = true;
      cancelAnimationFrame(rafId);
    }
  });

  lapBtn.addEventListener('click', () => {
    laps.unshift(elapsedMs);
    renderLaps();
  });

  resetBtn.addEventListener('click', () => {
    running = false;
    cancelAnimationFrame(rafId);
    elapsedMs = 0;
    laps = [];
    dial.classList.remove('running');
    startBtn.textContent = 'Start';
    startBtn.classList.remove('btn-stop');
    startBtn.classList.add('btn-primary');
    lapBtn.disabled = true;
    resetBtn.disabled = true;
    render();
    renderLaps();
  });

  render();
</script>

</body>
</html>
